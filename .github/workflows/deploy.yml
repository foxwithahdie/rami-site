# Build the site and publish it to GitHub Pages.
#
# The custom domain is carried by public/CNAME, which Astro copies into dist/
# verbatim. Keep it there: a Pages deploy made by Actions replaces the whole
# site, so a custom domain that lives only in the repo settings can get dropped
# on a later deploy. The file is the durable copy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # so you can redeploy from the Actions tab by hand

# Allow one deploy at a time; never cancel one midway, since that can leave
# Pages serving a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` not `npm install`: it installs exactly what package-lock.json
      # pins, so a build here matches the one on your machine.
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
